  <script src="/_sdk/f344579cd2b2cf70.editing_sdk.js" integrity="sha512-bzdgmfJ/pl/acJqgk+LGvYwJbF03Y2d6f4oZHD96WjqTnvQUZBGVAQkTDRz+fyIMjVc+AXkpwFXqDYLeHDMLSw=="></script>
  <script>
        const TOTAL_PAGES = 30;
        let currentPage = 1;

        // TOC data
        const tocData = [
            {page:1,label:'Copertina'},{page:2,label:'Introduzione'},{page:3,label:'Panoramica Moduli'},
            {page:4,label:'M1: Scripting con IA'},{page:7,label:'M1: Prompt pronti'},{page:8,label:'M1: Checklist'},{page:9,label:'M1: Quiz'},
            {page:11,label:'M2: Produzione Vocale'},{page:14,label:'M2: Prompt pronti'},{page:15,label:'M2: Checklist'},{page:16,label:'M2: Quiz'},
            {page:18,label:'M3: Montaggio Automatizzato'},{page:21,label:'M3: Prompt pronti'},{page:22,label:'M3: Checklist'},{page:23,label:'M3: Quiz'},
            {page:25,label:'M4: Monetizzazione e Lancio'},{page:27,label:'M4: Prompt pronti'},{page:28,label:'M4: Checklist'},{page:29,label:'M4: Quiz'},
            {page:30,label:'Conclusione'}
        ];

        function init() {
            buildTOC();
            loadChecks();
            showPage(1);
            lucide.createIcons();
        }

        function buildTOC() {
            const list = document.getElementById('toc-list');
            tocData.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<button class="w-full text-left py-2 px-3 rounded hover:bg-neutral-800 text-neutral-300 hover:text-amber-400 transition" onclick="goToPage(${item.page})">${item.label}</button>`;
                list.appendChild(li);
            });
        }

        function showPage(n) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.querySelector(`[data-page="${n}"]`);
            if (target) target.classList.add('active');
            currentPage = n;
            document.getElementById('page-counter').textContent = `${n} / ${TOTAL_PAGES}`;
            document.getElementById('progress').style.width = `${(n/TOTAL_PAGES)*100}%`;
            window.scrollTo(0,0);
        }

        function nextPage() { if (currentPage < TOTAL_PAGES) showPage(currentPage + 1); }
        function prevPage() { if (currentPage > 1) showPage(currentPage - 1); }
        function goToPage(n) { showPage(n); toggleTOC(); }

        function toggleTOC() {
            document.getElementById('toc-overlay').classList.toggle('hidden');
        }

        function copyPrompt(el) {
            const text = el.querySelector('p').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2000);
            });
        }

        function answerQuiz(btn) {
            const block = btn.closest('.quiz-block');
            if (block.dataset.answered) return;
            block.dataset.answered = 'true';
            const correct = parseInt(block.dataset.correct);
            const idx = parseInt(btn.dataset.idx);
            const options = block.querySelectorAll('.quiz-option');
            options[correct].classList.add('correct');
            if (idx !== correct) btn.classList.add('wrong');
            options.forEach(o => o.style.pointerEvents = 'none');
        }

        // Persist checklists in localStorage
        function loadChecks() {
            document.querySelectorAll('[data-check]').forEach(cb => {
                const key = cb.dataset.check;
                cb.checked = localStorage.getItem('ebook_' + key) === '1';
                cb.addEventListener('change', () => {
                    localStorage.setItem('ebook_' + key, cb.checked ? '1' : '0');
                });
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
